[project]
name = "dml"
version = "0.0.1"
description = "Dynamic matrix completion under informative missingness (research code)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "tabulate"]

[project.optional=dependencies]
dev = ["pytest"]

[tool.setuotools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]